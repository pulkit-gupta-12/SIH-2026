version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: legalmetro_db
    environment:
      POSTGRES_DB: legalmetro
      POSTGRES_USER: legalmetro
      POSTGRES_PASSWORD: legalmetro_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalmetro"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legalmetro_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
